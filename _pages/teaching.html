permalink: /teaching/
author_profile: true

{% include base_path %}

<h2>Courses</h2>

{% assign teaching_posts = site.teaching | sort: "title" %}
<div class="teaching-course-list" style="display: flex; flex-direction: column; align-items: center; gap: 0.75rem; margin: 1.5rem auto;">
{% for post in teaching_posts %}
  <a class="teaching-course-button" href="{{ post.url | prepend: base_path }}" style="display: block; box-sizing: border-box; width: 100%; max-width: 34rem; padding: 0.65rem 1.25rem; color: var(--action-text, #ffffff); font-weight: 700; text-align: center; text-decoration: none; background-color: var(--action-color, #00579C); border-radius: 12px;">{{ post.title }}</a>
{% endfor %}
</div>
